<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #184A43;
    color: white;
    overflow-x: hidden;
}

/* MENU BUTTON */
.menuBtn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 3000;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: none;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: 0.2s ease;
}

.menuBtn.hide {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    height: 100%;
    width: 220px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    padding: 20px;
    transition: left 0.4s ease;
    z-index: 2000;
}

.sidebar.open {
    left: 0;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* CENTER LAYOUT */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.section {
    display: none;
    width: 360px;
    background: rgba(9,89,80,0.95);
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);

    /* 🔥 CENTER EVERYTHING INSIDE */
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* HEADINGS */
h2 {
    text-align: center;
    margin-top: 0;
}

/* 🔥 CENTER INPUTS PROPERLY */
input, textarea {
    width: 85%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    outline: none;
    text-align: center;
}

/* BUTTON */
button {
    width: 85%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}

.final {
    font-size: 22px;
    color: gold;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<!-- MENU BUTTON -->
<button class="menuBtn" onclick="toggleSidebar()" id="menuBtn">☰</button>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <button onclick="show('calculator')">Calculator</button>
    <button onclick="show('gram')">Cost/Gram</button>
    <button onclick="show('quote')">Quote</button>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- CALCULATOR -->
    <div id="calculator" class="section">
        <h2>3D Print Calculator</h2>

        <input id="weight" placeholder="Weight (g)">
        <input id="price" placeholder="£ per gram">
        <input id="hours" placeholder="Hours">
        <input id="minutes" placeholder="Minutes">

        <button onclick="calc()">Calculate</button>

        <div id="result"></div>
    </div>

    <!-- GRAM -->
    <div id="gram" class="section">
        <h2>Cost per Gram</h2>

        <input id="spoolPrice" placeholder="Spool price £">
        <input id="spoolWeight" placeholder="Spool weight g">

        <button onclick="gram()">Calculate</button>

        <div id="gramResult"></div>
    </div>

    <!-- QUOTE -->
    <div id="quote" class="section">
        <h2>Quote Generator</h2>

        <input id="customer" placeholder="Customer name">
        <input id="print" placeholder="Print name">
        <textarea id="notes" placeholder="Notes"></textarea>

        <button onclick="quote()">Generate</button>

        <pre id="quoteOut"></pre>
    </div>

</div>

<script>

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

/* SIDEBAR TOGGLE */
function toggleSidebar() {
    sidebar.classList.toggle("open");

    if (sidebar.classList.contains("open")) {
        menuBtn.classList.add("hide");
    } else {
        menuBtn.classList.remove("hide");
    }
}

/* CLICK OUTSIDE CLOSE */
document.addEventListener("click", function(e) {
    if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove("open");
        menuBtn.classList.remove("hide");
    }
});

/* SHOW SECTION */
function show(id) {
    document.querySelectorAll(".section").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "flex";

    sidebar.classList.remove("open");
    menuBtn.classList.remove("hide");
}

/* DEFAULT */
show("calculator");

/* CALC */
function calc() {
    let w = +weight.value || 0;
    let p = +price.value || 0;
    let h = +hours.value || 0;
    let m = +minutes.value || 0;

    let time = h + (m / 60);
    let cost = (w * p) + (time * 1.5) + (w * 0.05);
    let final = cost * 1.25;

    result.innerHTML = `<div class="final">£${final.toFixed(2)}</div>`;
}

/* GRAM */
function gram() {
    let p = +spoolPrice.value || 0;
    let w = +spoolWeight.value || 1;

    gramResult.innerHTML = "£" + (p / w).toFixed(3) + " per gram";
}

/* QUOTE */
function quote() {
    quoteOut.innerText =
        "Customer: " + customer.value +
        "\nPrint: " + print.value +
        "\nNotes: " + notes.value;
}

</script>

</body>
</html>

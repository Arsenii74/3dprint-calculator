<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Price Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #184A43;
    color: white;
    margin: 0;
}

/* TOGGLE BUTTON */
.menuBtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 2000;
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: -260px; /* hidden */
    top: 0;
    height: 100%;
    width: 220px;
    background: rgba(0,0,0,.7);
    backdrop-filter: blur(10px);
    padding: 20px;
    transition: left 0.3s ease;
    z-index: 1500;
}

.sidebar.open {
    left: 0;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

/* MAIN CONTENT */
.container {
    margin-left: 20px;
    padding: 20px;
    transition: margin-left 0.3s ease;
}

.container.shift {
    margin-left: 260px;
}

/* SECTIONS */
.section {
    display: none;
}

/* INPUTS */
input, textarea, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

.results {
    margin-top: 20px;
    line-height: 1.8;
}

.final {
    font-size: 28px;
    font-weight: bold;
    color: #ffd700;
}
</style>
</head>

<body>

<!-- TOGGLE BUTTON -->
<button class="menuBtn" onclick="toggleSidebar()">☰ Menu</button>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>⚙️ Menu</h2>

    <button onclick="showSection('calculator')">🏠 Calculator</button>
    <button onclick="showSection('history')">📜 History</button>
    <button onclick="showSection('settings')">⚙️ Settings</button>
    <button onclick="showSection('gramCalc')">🧵 Cost / Gram</button>
    <button onclick="showSection('quote')">🧾 Quote</button>
</div>

<!-- MAIN CONTENT -->
<div class="container">

    <!-- CALCULATOR -->
    <div id="calculator" class="section">
        <h1>3D Print Price Calculator</h1>

        <label>Model Weight (grams)</label>
        <input type="number" id="weight">

        <label>Filament Price (£ per gram)</label>
        <input type="number" id="filamentPrice" step="0.001" value="0.011">

        <label>Print Time (hours)</label>
        <input type="number" id="hours">

        <label>Print Time (minutes)</label>
        <input type="number" id="minutes">

        <button onclick="calculatePrice()">Calculate Price</button>

        <div class="results" id="results"></div>
    </div>

    <!-- HISTORY -->
    <div id="history" class="section">
        <h2>📜 History</h2>
        <div id="historyList"></div>
        <button onclick="clearHistory()">Clear History</button>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="section">
        <h2>⚙️ Settings</h2>

        <label>Default filament price</label>
        <input id="defaultFilament" type="number">

        <label>Round to:</label>
        <select id="rounding">
            <option>10p</option>
            <option>50p</option>
            <option>£1</option>
        </select>
    </div>

    <!-- COST PER GRAM -->
    <div id="gramCalc" class="section">
        <h2>🧵 Cost Per Gram</h2>

        <label>Spool price (£)</label>
        <input id="spoolPrice">

        <label>Spool weight (g)</label>
        <input id="spoolWeight">

        <button onclick="calculateGramCost()">Calculate</button>

        <div id="gramResult"></div>
    </div>

    <!-- QUOTE -->
    <div id="quote" class="section">
        <h2>🧾 Quote Generator</h2>

        <label>Customer Name</label>
        <input id="customerName">

        <label>Print Name</label>
        <input id="printName">

        <label>Notes</label>
        <textarea id="notes"></textarea>

        <button onclick="generateQuote()">Generate Quote</button>

        <pre id="quoteText"></pre>
    </div>

</div>

<script>

/* TOGGLE SIDEBAR */
function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const container = document.querySelector(".container");

    sidebar.classList.toggle("open");
    container.classList.toggle("shift");
}

/* SHOW SECTIONS */
function showSection(section) {

    const sections = document.querySelectorAll(".section");
    sections.forEach(s => s.style.display = "none");

    document.getElementById(section).style.display = "block";

    // auto close sidebar
    document.querySelector(".sidebar").classList.remove("open");
    document.querySelector(".container").classList.remove("shift");
}

/* START PAGE */
showSection("calculator");

/* CALCULATOR */
function calculatePrice() {
    const weight = parseFloat(document.getElementById("weight").value) || 0;
    const filamentPrice = parseFloat(document.getElementById("filamentPrice").value) || 0.011;

    const hours = parseFloat(document.getElementById("hours").value) || 0;
    const minutes = parseFloat(document.getElementById("minutes").value) || 0;

    const totalHours = hours + (minutes / 60);

    const rule1 = weight * filamentPrice;
    const rule2 = totalHours * 1.50;
    const rule3 = weight * 0.05;

    const subtotal = rule1 + rule2 + rule3;
    const profit = subtotal * 0.25;

    const finalPrice = Math.round((subtotal + profit) * 10) / 10;

    document.getElementById("results").innerHTML = `
        <strong>Filament Cost:</strong> £${rule1.toFixed(2)}<br>
        <strong>Print Time:</strong> £${rule2.toFixed(2)}<br>
        <strong>Post Processing:</strong> £${rule3.toFixed(2)}<br>
        <strong>Profit:</strong> £${profit.toFixed(2)}<br>
        <hr>
        <div class="final">Suggested Price: £${finalPrice.toFixed(2)}</div>
    `;

    let history = JSON.parse(localStorage.getItem("history")) || [];
    history.unshift(`£${finalPrice.toFixed(2)}`);
    localStorage.setItem("history", JSON.stringify(history));

    showHistory();
}

/* HISTORY */
function showHistory() {
    let history = JSON.parse(localStorage.getItem("history")) || [];
    document.getElementById("historyList").innerHTML = history.join("<br>");
}

function clearHistory() {
    localStorage.removeItem("history");
    document.getElementById("historyList").innerHTML = "";
}

/* COST PER GRAM */
function calculateGramCost() {
    let price = parseFloat(document.getElementById("spoolPrice").value) || 0;
    let weight = parseFloat(document.getElementById("spoolWeight").value) || 1;

    let cost = price / weight;

    document.getElementById("gramResult").innerHTML =
        "Cost per gram = £" + cost.toFixed(3);
}

/* QUOTE */
function generateQuote() {
    document.getElementById("quoteText").innerText =
        "Customer: " + document.getElementById("customerName").value +
        "\n\nPrint: " + document.getElementById("printName").value +
        "\n\nNotes:\n" + document.getElementById("notes").value +
        "\n\n" + document.getElementById("results").innerText;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Calculator</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #184A43;
    color: white;
}

/* MENU */
.menuBtn {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: none;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.menuBtn.hide {
    opacity: 0;
    pointer-events: none;
}

/* SIDEBAR */
.sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    width: 220px;
    height: 100%;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(12px);
    padding: 20px;
    transition: 0.4s;
}

.sidebar.open { left: 0; }

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

/* CENTER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.section {
    display: none;
    width: 360px;
    background: rgba(9,89,80,0.95);
    padding: 25px;
    border-radius: 14px;
    flex-direction: column;
    align-items: center;
}

h2 { text-align: center; }

input, textarea {
    width: 85%;
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    text-align: center;
}

button {
    width: 85%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
}

button + button {
    margin-top: 10px;
}

.final {
    font-size: 22px;
    color: gold;
    text-align: center;
}

.breakdown {
    text-align: center;
    font-size: 14px;
    line-height: 1.6;
}

/* CALCULATOR DEFAULT VIEW FIX */
#calculator {
    display: flex;
}
</style>
</head>

<body>

<button class="menuBtn" id="menuBtn" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
    <button onclick="show('calculator')">Calculator</button>
    <button onclick="show('gram')">Cost/Gram</button>
    <button onclick="show('quote')">Quote</button>
</div>

<div class="container">

<!-- CALCULATOR -->
<div id="calculator" class="section">
    <h2>3D Print Calculator</h2>

    <input id="weight" placeholder="Weight (g)">
    <input id="price" placeholder="£ per gram">
    <input id="hours" placeholder="Hours">
    <input id="minutes" placeholder="Minutes">

    <button onclick="calc()">Calculate</button>

    <div id="result"></div>
</div>

<!-- COST / GRAM -->
<div id="gram" class="section">
    <h2>Cost per Gram</h2>

    <input id="spoolPrice" placeholder="Spool price £">
    <input id="spoolWeight" placeholder="Spool weight g">

    <button onclick="gram()">Calculate</button>
    <button onclick="setDefaultPrice()">Set Default Price</button>

    <div id="gramResult"></div>
</div>

<!-- QUOTE -->
<div id="quote" class="section">
    <h2>Quote Generator</h2>

    <input id="customerName" placeholder="Customer name">
    <input id="printName" placeholder="Print name">
    <textarea id="notes" placeholder="Notes"></textarea>

    <button onclick="quote()">Generate Quote</button>

    <pre id="quoteOut"></pre>
</div>

</div>

<script>

const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

let breakdown = {};

/* SIDEBAR */
function toggleSidebar() {
    sidebar.classList.toggle("open");
    menuBtn.classList.toggle("hide");
}

/* CLOSE OUTSIDE */
document.addEventListener("click", (e) => {
    if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
        sidebar.classList.remove("open");
        menuBtn.classList.remove("hide");
    }
});

/* SHOW PAGE */
function show(id) {
    document.querySelectorAll(".section").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "flex";

    sidebar.classList.remove("open");
    menuBtn.classList.remove("hide");
}

/* STARTUP FIX */
document.addEventListener("DOMContentLoaded", function () {
    show("calculator");

    const saved = localStorage.getItem("defaultPrice");
    if (saved) {
        document.getElementById("price").value = saved;
    }
});

/* CALCULATOR */
function calc() {
    let w = Number(document.getElementById("weight").value) || 0;
    let p = Number(document.getElementById("price").value) || 0;
    let h = Number(document.getElementById("hours").value) || 0;
    let m = Number(document.getElementById("minutes").value) || 0;

    let time = h + (m / 60);

    let material = w * p;
    let timeCost = time * 1.5;
    let post = w * 0.05;
    let fail = (material + timeCost + post) * 0.25;

    let final = material + timeCost + post + fail;

    breakdown = { material, timeCost, post, fail, final };

    document.getElementById("result").innerHTML =
    `<div class="breakdown">
        Material Cost: £${material.toFixed(2)}<br>
        Print Time: £${timeCost.toFixed(2)}<br>
        Post-Processing Charge: £${post.toFixed(2)}<br>
        Fail Risk: £${fail.toFixed(2)}
    </div>
    <div class="final">£${final.toFixed(2)}</div>`;
}

/* COST / GRAM */
function gram() {
    let p = Number(document.getElementById("spoolPrice").value) || 0;
    let w = Number(document.getElementById("spoolWeight").value) || 1;

    document.getElementById("gramResult").innerText =
        "£" + (p / w).toFixed(3) + " per gram";
}

/* DEFAULT PRICE */
function setDefaultPrice() {
    let p = Number(document.getElementById("spoolPrice").value) || 0;
    let w = Number(document.getElementById("spoolWeight").value) || 1;

    let cost = p / w;

    localStorage.setItem("defaultPrice", cost.toFixed(3));
    document.getElementById("price").value = cost.toFixed(3);

    alert("Default price saved!");
}

/* QUOTE */
function quote() {

    if (!breakdown.final) {
        document.getElementById("quoteOut").innerText =
        "Please calculate first.";
        return;
    }

    let customer = document.getElementById("customerName").value || "N/A";
    let print = document.getElementById("printName").value || "N/A";
    let notes = document.getElementById("notes").value || "";

    document.getElementById("quoteOut").innerText =
`Customer: ${customer}
Print: ${print}

Notes:
${notes}

-------------------
BREAKDOWN

Material Cost: £${breakdown.material.toFixed(2)}
Print Time: £${breakdown.timeCost.toFixed(2)}
Post-Processing Charge: £${breakdown.post.toFixed(2)}
Fail Risk: £${breakdown.fail.toFixed(2)}

FINAL PRICE: £${breakdown.final.toFixed(2)}
`;
}

</script>

</body>
</html>

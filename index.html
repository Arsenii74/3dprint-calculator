<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Price Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #184A43;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        background: #095950;
        padding: 30px;
        border-radius: 15px;
        width: 420px;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 15px;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 20px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }

    .results {
        margin-top: 20px;
        line-height: 1.8;
    }

    .final {
        font-size: 28px;
        font-weight: bold;
        color: #ffd700;
    }

    hr {
        border: 1px solid #555;
    }
.sidebar{
position:fixed;
left:0;
top:0;
height:100%;
width:220px;
background:rgba(0,0,0,.7);
backdrop-filter:blur(10px);
padding:20px;
overflow-y:auto;
}

.sidebar button{
width:100%;
margin-bottom:10px;
}

.container{
margin-left:250px;
}
</style>
</head>
<body>
<div class="sidebar">
    <h2>⚙️ Menu</h2>

    <button onclick="showSection('calculator')">🏠 Calculator</button>
    <button onclick="showSection('history')">📜 History</button>
    <button onclick="showSection('settings')">⚙️ Settings</button>
    <button onclick="showSection('gramCalc')">🧵 Cost / Gram</button>
    <button onclick="showSection('quote')">🧾 Quote Generator</button>
</div>
<div class="container">
    <h1>3D Print Price Calculator</h1>

    <label>Model Weight (grams)</label>
    <input type="number" id="weight" placeholder="e.g. 150">

    <label>Filament Price (£ per gram)</label>
    <input type="number" id="filamentPrice" step="0.001" value="0.011">

    <label>Print Time</label>
    <input type="number" id="hours" placeholder="Hours (e.g. 2)">
    
    <input type="number" id="minutes" placeholder="Minutes (e.g. 30)">

    <button onclick="calculatePrice()">Calculate Price</button>

    <div class="results" id="results"></div>
<div id="history" style="display:none">
<h2>📜 History</h2>

<div id="historyList"></div>

<button onclick="clearHistory()">
Clear History
</button>

</div>
    <div id="settings" style="display:none">

<h2>⚙️ Settings</h2>

Default filament price

<input id="defaultFilament" type="number">

Round to:

<select id="rounding">
<option>10p</option>
<option>50p</option>
<option>£1</option>
</select>

</div>
    <div id="gramCalc" style="display:none">

<h2>🧵 Cost Per Gram</h2>

Spool price (£)

<input id="spoolPrice">

Spool weight (g)

<input id="spoolWeight">

<button onclick="calculateGramCost()">

Calculate

</button>

<div id="gramResult"></div>

</div>
    <div id="quote" style="display:none">

<h2>🧾 Quote Generator</h2>

Customer Name

<input id="customerName">

Print Name

<input id="printName">

Notes

<textarea id="notes"></textarea>

<button onclick="generateQuote()">

Generate Quote

</button>

<pre id="quoteText"></pre>

</div>
</div>

<script>
function calculatePrice() {
    const weight = parseFloat(document.getElementById("weight").value) || 0;
    const filamentPrice = parseFloat(document.getElementById("filamentPrice").value) || 0.011;

    const hours = parseFloat(document.getElementById("hours").value) || 0;
    const minutes = parseFloat(document.getElementById("minutes").value) || 0;

    // Convert time → total hours
    const totalHours = hours + (minutes / 60);

    // Rule 1
    const rule1 = weight * filamentPrice;

    // Rule 2
    const rule2 = totalHours * 1.50;

    // Rule 3
    const rule3 = weight * 0.05;

    // Subtotal
    const subtotal = rule1 + rule2 + rule3;

    // Rule 4
    const profit = subtotal * 0.25;

    // Final price
    const finalPrice = Math.round((subtotal + profit) * 10) / 10;

    document.getElementById("results").innerHTML = `
        <strong>Filament Cost:</strong> £${rule1.toFixed(2)}<br>
        <strong>Print Time:</strong> £${rule2.toFixed(2)}<br>
        <strong>Post-Processing Charge:</strong> £${rule3.toFixed(2)}<br>
        <strong>Fail Risk:</strong> £${profit.toFixed(2)}<br>
        <hr>
        <div class="final">Suggested Sale Price: £${finalPrice.toFixed(2)}</div>
    `;
    let item = `£${finalPrice.toFixed(2)}`;

let history = JSON.parse(localStorage.getItem("history")) || [];

history.unshift(item);

localStorage.setItem("history", JSON.stringify(history));

showHistory();
}
    function calculateGramCost(){

let price=parseFloat(spoolPrice.value)||0;

let weight=parseFloat(spoolWeight.value)||1;

let cost=price/weight;

gramResult.innerHTML=
"Cost per gram = £"+cost.toFixed(3);

}

function generateQuote(){

quoteText.innerText=
"Customer: "+customerName.value+

"\n\nPrint: "+printName.value+

"\n\n"+results.innerText+

"\n\nNotes:\n"+notes.value;

}

function showHistory(){

let history=JSON.parse(localStorage.getItem("history"))||[];

historyList.innerHTML=history.join("<br>");

}

function clearHistory(){

localStorage.removeItem("history");

historyList.innerHTML="";

}

function showSection(section){

history.style.display="none";
settings.style.display="none";
gramCalc.style.display="none";
quote.style.display="none";

if(section!="calculator")
document.getElementById(section).style.display="block";

}
</script>

</body>
</html>
